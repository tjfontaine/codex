[package]
name = "codex-cloud-tasks-client"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "codex_cloud_tasks_client"
path = "src/lib.rs"

[features]
default = []
mock = []

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
diffy = "0.4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.17"
codex-git = { path = "../utils/git" }
