[package]
name = "codex-backend-client"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { path = "../../../codex-wasm/wasi-reqwest" }
codex-client = { path = "../codex-client" }
codex-protocol = { path = "../protocol" }
codex-core = { path = "../core" }

[dev-dependencies]
pretty_assertions = "1"
