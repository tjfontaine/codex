[package]
edition = "2024"
license = "Apache-2.0"
name = "codex-core"
version = "0.0.0"

[lib]
doctest = false
name = "codex_core"
path = "src/lib.rs"

[[bin]]
name = "codex-write-config-schema"
path = "src/bin/config_schema.rs"

[dependencies]
anyhow = { version = "1" }
arc-swap = "1.8.2"
async-channel = { version = "2.3.1" }
async-trait = { version = "0.1.89" }
askama = { version = "0.15.4" }
base64 = { version = "0.22.1" }
bm25 = { version = "2.3.2" }
chardetng = { version = "0.1.17" }
chrono = { version = "0.4.43", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
codex-api = { path = "../codex-api" }
codex-app-server-protocol = { path = "../app-server-protocol" }
codex-apply-patch = { path = "../apply-patch" }
codex-async-utils = { path = "../async-utils" }
codex-code-mode = { path = "../code-mode" }
codex-connectors = { path = "../connectors" }
codex-config = { path = "../config" }
codex-exec-server = { path = "../exec-server" }
codex-features = { path = "../features" }
codex-login = { path = "../login" }
codex-shell-command = { path = "../shell-command" }
codex-skills = { path = "../skills" }
codex-execpolicy = { path = "../execpolicy" }
codex-file-search = { path = "../file-search" }
codex-git = { path = "../utils/git" }
codex-hooks = { path = "../hooks" }
codex-network-proxy = { path = "../network-proxy" }
codex-otel = { path = "../../../codex-wasm/wasi-codex-otel" }
codex-artifacts = { path = "../artifacts" }
codex-protocol = { path = "../protocol" }
codex-rmcp-client = { path = "../rmcp-client" }
codex-state = { path = "../state" }
codex-terminal-detection = { path = "../terminal-detection" }
codex-utils-absolute-path = { path = "../utils/absolute-path" }
codex-utils-cache = { path = "../utils/cache" }
codex-utils-image = { path = "../utils/image" }
codex-utils-home-dir = { path = "../utils/home-dir" }
codex-utils-pty = { path = "../utils/pty" }
codex-utils-readiness = { path = "../utils/readiness" }
codex-secrets = { path = "../secrets" }
codex-utils-string = { path = "../utils/string" }
codex-utils-stream-parser = { path = "../utils/stream-parser" }
csv = { version = "1.3.1" }
dirs = { version = "6" }
dunce = { version = "1.0.4" }
encoding_rs = { version = "0.8.35" }
env-flags = { version = "0.1.1" }
eventsource-stream = { version = "0.2.3" }
futures = { version = "0.3", default-features = false , features = ["alloc"] }
http = { version = "1.3.1" }
iana-time-zone = { version = "0.1.64" }
indexmap = { version = "2.12.0" }
libc = { version = "0.2.182" }
once_cell = { version = "1.20.2" }
rand = { version = "0.9" }
regex-lite = { version = "0.1.8" }
reqwest = { path = "../../../codex-wasm/wasi-reqwest" }
rmcp = { version = "0.15.0", default-features = false, features = ["base64", "macros", "schemars", "server"] }
schemars = { version = "0.8.22" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
serde_yaml = { version = "0.9" }
sha1 = { version = "0.10.6" }
shlex = { version = "1.3.0" }
similar = { version = "2.7.0" }
tempfile = { version = "3.23.0" }
test-log = { version = "0.2.19" }
thiserror = { version = "2.0.17" }
time = { version = "0.3.47", features = ["formatting", "parsing", "local-offset", "macros"] }
tokio = { path = "../../../codex-wasm/wasi-tokio" }
tokio-util = { path = "../../../codex-wasm/wasi-tokio-util" }
toml = { version = "0.9.5" }
toml_edit = { version = "0.24.0" }
tracing = { version = "0.1.44", features = ["log"] }
url = { version = "2" }
uuid = { version = "1", features = ["serde", "v4", "v5"] }
wildmatch = { version = "2.6.1" }
console-log = { path = "../../../crates/console-log" }
codex-shell-escalation = { path = "../shell-escalation" }

[dev-dependencies]
assert_cmd = { version = "2" }
assert_matches = { version = "1.5.0" }
codex-arg0 = { path = "../arg0" }
codex-otel = { path = "../../../codex-wasm/wasi-codex-otel" }
codex-test-macros = { path = "../test-macros" }
codex-utils-cargo-bin = { path = "../utils/cargo-bin" }
ctor = { version = "0.6.3" }
insta = { version = "1.46.3" }
maplit = { version = "1.0.2" }
opentelemetry = { version = "0.31.0" }
predicates = { version = "3" }
pretty_assertions = { version = "1.4.1" }
test-case = "3.3.1"
opentelemetry_sdk = { version = "0.31.0", features = ["experimental_metrics_custom_reader", "metrics"] }
serial_test = { version = "3.2.0" }
tempfile = { version = "3.23.0" }
tracing-opentelemetry = { version = "0.32.0" }
tracing-subscriber = { version = "0.3.22" }
tracing-test = { version = "0.2.5", features = ["no-env-filter"] }
walkdir = { version = "2.5.0" }
wiremock = { version = "0.6" }
console-log = { path = "../../../crates/console-log" }

[package.metadata.cargo-shear]
ignored = ["openssl-sys"]
