[package]
name = "codex-config"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = { version = "1" }
codex-app-server-protocol = { path = "../app-server-protocol" }
codex-execpolicy = { path = "../execpolicy" }
codex-features = { path = "../features" }
codex-git-utils = { path = "../git-utils" }
codex-model-provider-info = { path = "../model-provider-info" }
codex-network-proxy = { path = "../../../codex-wasm/wasi-network-proxy" }
codex-protocol = { path = "../protocol" }
codex-utils-absolute-path = { path = "../utils/absolute-path" }
dunce = { version = "1.0.4" }
futures = { version = "0.3", default-features = false , features = ["alloc", "std"] }
multimap = { version = "0.10.0" }
schemars = { version = "0.8.22" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
serde_path_to_error = { version = "0.1.20" }
sha2 = { version = "0.10" }
thiserror = { version = "2.0.17" }
tokio = { path = "../../../codex-wasm/wasi-tokio" }
toml = { version = "0.9.5" }
toml_edit = { version = "0.24.0" }
tracing = { version = "0.1.44" }
wildmatch = { version = "2.6.1" }

[dev-dependencies]
pretty_assertions = { version = "1.4.1" }
tempfile = { version = "3.23.0" }
tokio = { path = "../../../codex-wasm/wasi-tokio" }
