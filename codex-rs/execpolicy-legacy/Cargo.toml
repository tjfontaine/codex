[package]
name = "codex-execpolicy-legacy"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Legacy exec policy engine for validating proposed exec calls."

[[bin]]
name = "codex-execpolicy-legacy"
path = "src/main.rs"

[lib]
name = "codex_execpolicy_legacy"
path = "src/lib.rs"

[dependencies]
allocative = { version = "0.3.3" }
anyhow = { version = "1" }
clap = { version = "4", features = ["derive"] }
derive_more = { version = "2", features = ["display"] }
env_logger = { version = "0.11.9" }
log = { version = "0.4" }
multimap = { version = "0.10.0" }
path-absolutize = { path = "../../../codex-wasm/wasi-path-absolutize" }
regex-lite = { version = "0.1.8" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
serde_with = { version = "3.17", features = ["macros"] }
starlark = { version = "0.13.0" }

[dev-dependencies]
tempfile = { version = "3.23.0" }
