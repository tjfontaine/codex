[package]
name = "codex-otel"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

[lib]
doctest = false
name = "codex_otel"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4.43" }
codex-utils-absolute-path = { path = "../utils/absolute-path" }
codex-utils-string = { path = "../utils/string" }
codex-api = { path = "../codex-api" }
codex-app-server-protocol = { path = "../app-server-protocol" }
codex-protocol = { path = "../protocol" }
eventsource-stream = { version = "0.2.3" }
opentelemetry = { version = "0.31.0", features = ["logs", "metrics", "trace"] }
opentelemetry-appender-tracing = { version = "0.31.0" }
opentelemetry-otlp = { version = "0.31.0", features = ["grpc-tonic", "http-proto", "http-json", "logs", "metrics", "trace", "reqwest-blocking-client", "reqwest-rustls", "tls", "tls-roots"] }
opentelemetry-semantic-conventions = { version = "0.31.0" }
opentelemetry_sdk = { version = "0.31.0", features = ["experimental_trace_batch_span_processor_with_async_runtime", "experimental_metrics_custom_reader", "logs", "metrics", "rt-tokio", "testing", "trace"] }
http = { version = "1.3.1" }
os_info = { path = "../../../codex-wasm/wasi-os-info" }
reqwest = { path = "../../../codex-wasm/wasi-reqwest" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
strum_macros = { version = "0.28.0" }
thiserror = { version = "2.0.17" }
tokio = { path = "../../../codex-wasm/wasi-tokio" }
tokio-tungstenite = { path = "../../../codex-wasm/wasi-tokio-tungstenite" }
tracing = { version = "0.1.44" }
tracing-opentelemetry = { version = "0.32.0" }
tracing-subscriber = { version = "0.3.22" }

[dev-dependencies]
opentelemetry_sdk = { version = "0.31.0", features = ["experimental_metrics_custom_reader", "testing"] }
pretty_assertions = { version = "1.4.1" }
