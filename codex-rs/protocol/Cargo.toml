[package]
edition = "2024"
license = "Apache-2.0"
name = "codex-protocol"
version = "0.0.0"

[lib]
name = "codex_protocol"
path = "src/lib.rs"

[dependencies]
chardetng = { version = "0.1.17" }
chrono = { version = "0.4.43", features = ["serde"] }
codex-async-utils = { path = "../async-utils" }
codex-execpolicy = { path = "../execpolicy" }
codex-git-utils = { path = "../git-utils" }
codex-network-proxy = { path = "../../../codex-wasm/wasi-network-proxy" }
codex-utils-absolute-path = { path = "../utils/absolute-path" }
codex-utils-image = { path = "../utils/image" }
codex-utils-string = { path = "../utils/string" }
codex-utils-template = { path = "../utils/template" }
encoding_rs = { version = "0.8.35" }
icu_decimal = { version = "2.1" }
icu_locale_core = { version = "2.1" }
icu_provider = { version = "2.1", features = ["sync"] }
quick-xml = { version = "0.38.4", features = ["serialize"] }
reqwest = { path = "../../../codex-wasm/wasi-reqwest" }
schemars = { version = "0.8.22" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
serde_with = { version = "3.17", features = ["macros", "base64"] }
strum = { version = "0.27.2" }
strum_macros = { version = "0.28.0" }
sys-locale = { version = "0.3.2" }
thiserror = { version = "2.0.17" }
tokio = { path = "../../../codex-wasm/wasi-tokio" }
tracing = { version = "0.1.44" }
uuid = { version = "1", features = ["serde", "v7", "v4"] }

[dev-dependencies]
anyhow = { version = "1" }
http = { version = "1.3.1" }
pretty_assertions = { version = "1.4.1" }
tempfile = { version = "3.23.0" }

[package.metadata.cargo-shear]
# Required because:
# `icu_provider`: contains a required `sync` feature for `icu_decimal`
# `strum`: as strum_macros in non-nightly builds
ignored = ["icu_provider", "strum"]
