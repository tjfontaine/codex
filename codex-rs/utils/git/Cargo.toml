[package]
name = "codex-git"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"

[dependencies]
once_cell = { version = "1.20.2" }
regex = "1"
schemars = { version = "0.8.22" }
serde = { version = "1", features = ["derive"] }
