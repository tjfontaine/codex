[package]
name = "codex-tui-app-server"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
autobins = false

[[bin]]
name = "codex-tui-app-server"
path = "src/main.rs"

[[bin]]
name = "md-events-app-server"
path = "src/bin/md-events.rs"

[lib]
name = "codex_tui_app_server"
path = "src/lib.rs"

[features]
default = []
# Enable vt100-based tests (emulator) when running with `--features vt100-tests`.
vt100-tests = []
# Gate verbose debug logging inside the TUI implementation.
debug-logs = []

[dependencies]
anyhow = { version = "1" }
base64 = { version = "0.22.1" }
chrono = { version = "0.4.43", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
codex-ansi-escape = { path = "../ansi-escape" }
codex-app-server-protocol = { path = "../app-server-protocol" }
codex-arg0 = { path = "../arg0" }
codex-client = { path = "../codex-client" }
codex-core = { path = "../core" }
codex-features = { path = "../features" }
codex-file-search = { path = "../file-search" }
codex-login = { path = "../login" }
codex-otel = { path = "../../../codex-wasm/wasi-codex-otel" }
codex-protocol = { path = "../protocol" }
codex-shell-command = { path = "../shell-command" }
codex-state = { path = "../state" }
codex-terminal-detection = { path = "../terminal-detection" }
codex-utils-approval-presets = { path = "../utils/approval-presets" }
codex-utils-absolute-path = { path = "../utils/absolute-path" }
codex-utils-cli = { path = "../utils/cli" }
codex-utils-elapsed = { path = "../utils/elapsed" }
codex-utils-fuzzy-match = { path = "../utils/fuzzy-match" }
codex-utils-sandbox-summary = { path = "../utils/sandbox-summary" }
codex-utils-sleep-inhibitor = { path = "../utils/sleep-inhibitor" }
codex-utils-string = { path = "../utils/string" }
color-eyre = { version = "0.6.3" }
crossterm = { path = "../../../codex-wasm/wasi-crossterm" }
derive_more = { version = "2", features = ["is_variant"] }
diffy = { version = "0.4.2" }
dirs = { version = "6" }
dunce = { version = "1.0.4" }
image = { version = "^0.25.9", default-features = false , features = ["jpeg", "png", "gif", "webp"] }
itertools = { version = "0.14.0" }
lazy_static = { version = "1" }
pathdiff = { version = "0.2" }
pulldown-cmark = { version = "0.10" }
rand = { version = "0.9" }
ratatui = { version = "0.29.0", features = ["scrolling-regions", "unstable-backend-writer", "unstable-rendered-line-info", "unstable-widget-ref"] }
ratatui-macros = { version = "0.6.0" }
regex-lite = { version = "0.1.8" }
reqwest = { path = "../../../codex-wasm/wasi-reqwest" }
rmcp = { version = "0.15.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
shlex = { version = "1.3.0" }
strum = { version = "0.27.2" }
strum_macros = { version = "0.28.0" }
supports-color = { version = "3.0.2" }
tempfile = { version = "3.23.0" }
textwrap = { version = "0.16.2" }
thiserror = { version = "2.0.17" }
tokio = { path = "../../../codex-wasm/wasi-tokio" }
tokio-stream = { version = "0.1.18", features = ["sync"] }
toml = { version = "0.9.5" }
tracing = { version = "0.1.44", features = ["log"] }
tracing-appender = { version = "0.2.3" }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
unicode-segmentation = { version = "1.12.0" }
unicode-width = { version = "0.2" }
url = { version = "2" }
webbrowser = { version = "1.0" }
uuid = { version = "1" }
tokio-util = { path = "../../../codex-wasm/wasi-tokio-util" }


[dev-dependencies]
codex-core = { path = "../core" }
codex-utils-cargo-bin = { path = "../utils/cargo-bin" }
codex-utils-pty = { path = "../utils/pty" }
assert_matches = { version = "1.5.0" }
chrono = { version = "0.4.43", features = ["serde"] }
insta = { version = "1.46.3" }
pretty_assertions = { version = "1.4.1" }
rand = { version = "0.9" }
serial_test = { version = "3.2.0" }
vt100 = { version = "0.16.2" }
uuid = { version = "1" }
